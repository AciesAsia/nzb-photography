<!DOCTYPE HTML>
<html lang="en">
<head>
	<title>Contact — NZB Photography</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Contact NZB Photography" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg: #fff;
			--accent: #00D3B7;
			--fg: #444;
			--fg-light: #999;
			--label: #aaa;
			--border: #d8d8d8;
			--input-bg: #fff;
		}

		html, body {
			min-height: 100%;
			font-family: 'Roboto', Helvetica, sans-serif;
			background: var(--bg);
			color: var(--fg);
		}

		#contact-wrap {
			max-width: 760px;
			margin: 0 auto;
			padding: 4em 2em 5em;
		}

		h1 {
			font-size: 1em;
			font-weight: 700;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: #bbb;
			margin-bottom: 1.5em;
		}

		.intro {
			font-size: 1em;
			line-height: 1.8;
			color: var(--fg);
			margin-bottom: 2.5em;
		}

		.field {
			margin-bottom: 1.5em;
		}

		label {
			display: block;
			font-size: 0.72em;
			font-weight: 700;
			letter-spacing: 0.15em;
			text-transform: uppercase;
			color: var(--label);
			margin-bottom: 0.5em;
		}

		input[type="text"],
		input[type="email"],
		textarea {
			width: 100%;
			padding: 0.8em 1em;
			background: var(--input-bg);
			border: 1px solid var(--border);
			color: var(--fg);
			font-family: inherit;
			font-size: 0.95em;
			border-radius: 3px;
			outline: none;
			transition: border-color 0.15s;
		}

		input[type="text"]:focus,
		input[type="email"]:focus,
		textarea:focus {
			border-color: var(--accent);
		}

		textarea {
			min-height: 180px;
			resize: vertical;
		}

		input[type="submit"] {
			margin-top: 0.5em;
			background: #333;
			color: #fff;
			border: none;
			padding: 0.8em 2.5em;
			font-family: inherit;
			font-size: 0.8em;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			cursor: pointer;
			border-radius: 3px;
			transition: background 0.15s;
		}

		input[type="submit"]:hover {
			background: var(--accent);
		}

		.direct-email {
			margin-top: 2.5em;
			padding-top: 2em;
			border-top: 1px solid #eee;
			font-size: 0.85em;
			color: var(--fg-light);
		}

		.direct-email a {
			color: var(--fg-light);
			text-decoration: none;
			border-bottom: 1px solid #ddd;
		}

		.direct-email a:hover {
			color: #333;
			border-bottom-color: var(--accent);
		}

		.back-link {
			display: inline-block;
			margin-top: 3em;
			font-size: 0.8em;
			letter-spacing: 0.08em;
			color: var(--fg-light);
			text-decoration: none;
			border-bottom: 1px solid #ddd;
			padding-bottom: 2px;
		}

		.back-link:hover {
			color: #333;
			border-bottom-color: var(--accent);
		}

		@media (max-width: 600px) {
			#contact-wrap { padding: 2.5em 1.25em 4em; }
		}
	</style>
</head>
<body>

<div id="contact-wrap">

	<h1>Contact Me</h1>

	<p class="intro">For commissions, print sales, licensing, or general enquiries — use the form below or email directly.</p>

	<form method="post" action="https://formspree.io/f/placeholder">

		<div class="field">
			<label for="name">Name</label>
			<input type="text" name="name" id="name" placeholder="Your name" required />
		</div>

		<div class="field">
			<label for="email">Email</label>
			<input type="email" name="email" id="email" placeholder="your@email.com" required />
		</div>

		<div class="field">
			<label for="subject">Subject</label>
			<input type="text" name="subject" id="subject" placeholder="Commission / Licensing / General" />
		</div>

		<div class="field">
			<label for="message">Message</label>
			<textarea name="message" id="message" placeholder="Your message..." required></textarea>
		</div>

		<input type="submit" value="Send Message" />

	</form>

	<div class="direct-email">
		Or email directly: <a href="mailto:nzbphotos@gmail.com">nzbphotos@gmail.com</a>
	</div>

	<a href="index.html" class="back-link">&#8592; Back to Gallery</a>

</div>

</body>
</html>
